services:
  # ---------- BASE DE DATOS ----------
  postgres:
    image: postgres:16
    container_name: sice_postgres
    environment:
      POSTGRES_DB: sice_db
      POSTGRES_USER: sice_user
      POSTGRES_PASSWORD: sice_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sice_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sice_user -d sice_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- API DE IA (PYTHON) ----------
  api-ia:
    build: ./api-ia
    container_name: sice_api
    ports:
      - "5000:5000"
    volumes:
      - ./api-ia:/app
    networks:
      - sice_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------- ORQUESTADOR n8n ----------
  n8n:
    image: n8nio/n8n:latest
    container_name: sice_n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=sice_db
      - DB_POSTGRESDB_USER=sice_user
      - DB_POSTGRESDB_PASSWORD=sice_pass
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-flows:/backup
    networks:
      - sice_network
    depends_on:
      postgres:
        condition: service_healthy
      #api-ia:
      #  condition: service_healthy

  # ---------- NOCODB (FRONTEND) ----------
  nocodb:
    image: nocodb/nocodb:latest
    container_name: sice_nocodb
    ports:
      - "8080:8080"
    volumes:
      - nocodb_data:/usr/app/data
    networks:
      - sice_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NC_DB=pg://postgres:5432?u=sice_user&p=sice_pass&d=sice_db
      - NC_ALLOW_LOCAL_HOOKS=true

  # ---------- MAILHOG (EMAIL DE PRUEBA) ----------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sice_mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interfaz web
    networks:
      - sice_network

  # -- RESTORE --
  restore:
    image: postgres:16
    container_name: sice_restore
    volumes:
      - ./scripts:/scripts
      - postgres_data:/var/lib/postgresql/data
    command: >
      bash -c "
      echo 'Esperando a PostgreSQL...' &&
      sleep 10 &&
      psql -h postgres -U sice_user -d sice_db -f /scripts/backup_nocodb.sql &&
      echo '✅ Base de datos restaurada' &&
      tail -f /dev/null
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sice_network

networks:
  sice_network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  nocodb_data: